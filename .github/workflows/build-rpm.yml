name: Build RPM
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  rpm:
    runs-on: ubuntu-24.04
    container: fedora:44
    outputs:
      version: ${{ steps.metadata.outputs.version }}
    steps:
      - name: Install build dependencies
        run: dnf install -y rpm-build rpmdevtools python3 python3-gobject python3-pyyaml desktop-file-utils appstream gettext systemd-rpm-macros git
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Prepare app version metadata
        id: metadata
        run: |
          SOURCE_DATE_EPOCH=$(git -c safe.directory="$GITHUB_WORKSPACE" show -s --format=%ct HEAD)
          export SOURCE_DATE_EPOCH
          echo "SOURCE_DATE_EPOCH=$SOURCE_DATE_EPOCH" >> "$GITHUB_ENV"
          APP_VERSION=$(python3 packaging/metadata.py)
          echo "version=$APP_VERSION" >> "$GITHUB_OUTPUT"
      - name: Build source and binary RPMs
        run: |
          rpmdev-setuptree
          VERSION='${{ steps.metadata.outputs.version }}'
          git -c safe.directory="$GITHUB_WORKSPACE" archive --format=tar.gz --prefix="bazzite-portal-${VERSION}/" --output="$HOME/rpmbuild/SOURCES/bazzite-portal-${VERSION}.tar.gz" HEAD
          rpmbuild -ba build/packaging/bazzite-portal.spec
          mkdir -p dist
          cp "$HOME"/rpmbuild/RPMS/noarch/*.rpm "$HOME"/rpmbuild/SRPMS/*.rpm dist/
      - uses: actions/upload-artifact@v7
        with:
          name: bazzite-portal-fedora44-rpms
          path: dist/*.rpm
          if-no-files-found: error

  release:
    needs: rpm
    if: github.event_name == 'push' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    concurrency:
      group: bazzite-portal-releases
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Prepare release
        id: release
        uses: actions/github-script@v8
        env:
          APP_VERSION: ${{ needs.rpm.outputs.version }}
        with:
          script: |
            const { spawnSync } = require('node:child_process');
            const repo = context.repo;
            const version = process.env.APP_VERSION;
            const pattern = /^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$/;
            if (!pattern.test(version)) throw new Error('Invalid app version');
            core.setOutput('publish', 'false');
            const tag = `v${version}`;
            const compare = (a, b) => {
              const left = a.split('.').map(BigInt), right = b.split('.').map(BigInt);
              for (let i = 0; i < 3; i++) {
                if (left[i] !== right[i]) return left[i] > right[i] ? 1 : -1;
              }
              return 0;
            };
            const releases = await github.paginate(github.rest.repos.listReleases,
              { ...repo, per_page: 100 });
            const published = releases.filter(r => !r.draft && !r.prerelease &&
              r.tag_name.startsWith('v') && pattern.test(r.tag_name.slice(1)));
            published.sort((a, b) => compare(b.tag_name.slice(1), a.tag_name.slice(1)));
            const previous = published[0];
            if (releases.some(r => !r.draft && r.tag_name === tag) ||
                (previous && compare(version, previous.tag_name.slice(1)) <= 0)) {
              core.info(`No Version increase to publish (${tag}).`);
              return;
            }
            const existingTag = spawnSync('git', ['rev-parse', '--verify', '--quiet',
              `refs/tags/${tag}^{commit}`], { encoding: 'utf8' });
            if (existingTag.error || ![0, 1].includes(existingTag.status)) {
              throw new Error('Could not verify the release tag', { cause: existingTag.error });
            }
            if (existingTag.status === 0 && existingTag.stdout.trim() !== context.sha) {
              throw new Error(`${tag} already points to another commit`);
            }
            const draft = releases.find(r => r.draft && r.tag_name === tag);
            if (draft && draft.target_commitish !== context.sha) {
              throw new Error(`The existing draft for ${tag} targets another commit`);
            }
            core.setOutput('tag', tag);
            core.setOutput('previous_tag', previous ? previous.tag_name : '');
            core.setOutput('publish', 'true');
      - uses: actions/download-artifact@v8
        if: steps.release.outputs.publish == 'true'
        with:
          name: bazzite-portal-fedora44-rpms
          path: dist
      - name: Verify release downloads
        id: binary
        if: steps.release.outputs.publish == 'true'
        shell: bash
        run: |
          shopt -s nullglob
          rpms=(dist/*.noarch.rpm)
          if (( ${#rpms[@]} != 1 )) || [[ ! -f "${rpms[0]}" || ! -s "${rpms[0]}" ]]; then
            echo 'Expected exactly one nonempty binary RPM.' >&2
            exit 1
          fi
          mv -- "${rpms[0]}" dist/bazzite-portal.rpm
          printf 'rpm=dist/bazzite-portal.rpm\n' >> "$GITHUB_OUTPUT"
      - name: Publish a new app version
        if: steps.release.outputs.publish == 'true'
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: ${{ steps.release.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: Bazzite Portal ${{ needs.rpm.outputs.version }}
          previous_tag: ${{ steps.release.outputs.previous_tag }}
          generate_release_notes: true
          files: ${{ steps.binary.outputs.rpm }}
          fail_on_unmatched_files: true
          prerelease: false
          make_latest: true
