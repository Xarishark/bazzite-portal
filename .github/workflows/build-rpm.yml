name: Build RPM
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  rpm:
    runs-on: ubuntu-latest
    container: fedora:44
    outputs:
      version: ${{ steps.metadata.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install build dependencies
        run: dnf install -y rpm-build rpmdevtools python3-devel python3-setuptools python3-wheel pyproject-rpm-macros python3-gobject python3-pyyaml desktop-file-utils appstream gettext systemd-rpm-macros git
      - name: Check app version metadata
        id: metadata
        run: |
          python3 - <<'PY'
          import os, re, tomllib, xml.etree.ElementTree as ET
          from pathlib import Path
          spec = Path('packaging/bazzite-portal.spec').read_text()
          version = re.search(r'^Version:\s+(\S+)', spec, re.MULTILINE).group(1)
          if not re.fullmatch(r'(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)', version):
              raise SystemExit('Use an X.Y.Z Version in the RPM spec.')
          versions = {
              'pyproject.toml': tomllib.loads(Path('pyproject.toml').read_text())['project']['version'],
              'bazzite_portal/__init__.py': re.search(r'^VERSION = "([^"]+)"', Path('bazzite_portal/__init__.py').read_text(), re.MULTILINE).group(1),
              'AppStream': ET.parse('packaging/io.github.Xarishark.bazzite_portal.metainfo.xml').find('releases/release').get('version'),
          }
          for source, actual in versions.items():
              if actual != version:
                  raise SystemExit(f'{source} has version {actual}; update it to match spec Version {version}.')
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write(f'version={version}\n')
          PY
      - name: Build source and binary RPMs
        run: |
          rpmdev-setuptree
          VERSION=$(sed -n 's/^Version:[[:space:]]*//p' packaging/bazzite-portal.spec)
          git archive --format=tar --prefix="bazzite-portal-${VERSION}/" HEAD | gzip > "$HOME/rpmbuild/SOURCES/bazzite-portal-${VERSION}.tar.gz"
          rpmbuild -ba packaging/bazzite-portal.spec
          mkdir -p dist
          cp "$HOME"/rpmbuild/RPMS/noarch/*.rpm "$HOME"/rpmbuild/SRPMS/*.rpm dist/
      - name: Prepare stable download filename
        run: cp dist/*.noarch.rpm dist/bazzite-portal.rpm
      - name: Generate RPM checksums
        run: |
          cd dist
          md5sum *.rpm > MD5SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: bazzite-portal-fedora44-rpms
          path: |
            dist/*.rpm
            dist/MD5SUMS
          if-no-files-found: error

  release:
    needs: rpm
    if: github.event_name == 'push' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: bazzite-portal-releases
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: bazzite-portal-fedora44-rpms
          path: dist
      - name: Verify release downloads
        run: |
          cd dist
          md5sum -c MD5SUMS
          test -s bazzite-portal.rpm
      - name: Publish a new app version
        uses: actions/github-script@v8
        env:
          APP_VERSION: ${{ needs.rpm.outputs.version }}
        with:
          script: |
            const fs = require('node:fs');
            const { execFileSync, spawnSync } = require('node:child_process');
            const repo = context.repo;
            const version = process.env.APP_VERSION;
            const pattern = /^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$/;
            if (!pattern.test(version)) throw new Error('Invalid app version');
            const tag = `v${version}`;
            const compare = (a, b) => {
              const left = a.split('.').map(BigInt), right = b.split('.').map(BigInt);
              for (let i = 0; i < 3; i++) {
                if (left[i] !== right[i]) return left[i] > right[i] ? 1 : -1;
              }
              return 0;
            };
            const releases = await github.paginate(github.rest.repos.listReleases,
              { ...repo, per_page: 100 });
            const published = releases.filter(r => !r.draft && !r.prerelease &&
              r.tag_name.startsWith('v') && pattern.test(r.tag_name.slice(1)));
            published.sort((a, b) => compare(b.tag_name.slice(1), a.tag_name.slice(1)));
            const previous = published[0];
            if (releases.some(r => !r.draft && r.tag_name === tag) ||
                (previous && compare(version, previous.tag_name.slice(1)) <= 0)) {
              core.info(`No Version increase to publish (${tag}).`);
              return;
            }
            const existingTag = spawnSync('git', ['rev-parse', '--verify', '--quiet',
              `refs/tags/${tag}^{commit}`], { encoding: 'utf8' });
            if (existingTag.status === 0 && existingTag.stdout.trim() !== context.sha) {
              throw new Error(`${tag} already points to another commit`);
            }
            const notes = await github.rest.repos.generateReleaseNotes({
              ...repo, tag_name: tag, target_commitish: context.sha,
              ...(previous ? { previous_tag_name: previous.tag_name } : {})
            });
            const range = previous ? `${previous.tag_name}..${context.sha}` : context.sha;
            const fields = execFileSync('git', ['log', '--reverse', '-z',
              '--format=%H%x00%s%x00%an', range], { encoding: 'utf8', maxBuffer: 32 * 1024 * 1024 })
              .split('\0');
            if (fields.at(-1) === '') fields.pop();
            const escape = text => text.replace(/[\\`*_[\]<>]/g, '\\$&');
            const commits = [];
            for (let i = 0; i < fields.length; i += 3) {
              const [sha, subject, author] = fields.slice(i, i + 3);
              commits.push(`- ${escape(subject)} ([${sha.slice(0, 7)}](https://github.com/${repo.owner}/${repo.repo}/commit/${sha})) — ${escape(author)}`);
            }
            const changelog = `${notes.data.body}\n\n## All commits\n\n${commits.join('\n')}\n`;
            fs.writeFileSync('dist/CHANGELOG.md', changelog);
            const body = changelog.length <= 100000 ? changelog :
              `See [the complete changelog](https://github.com/${repo.owner}/${repo.repo}/releases/download/${tag}/CHANGELOG.md).`;
            let draft = releases.find(r => r.draft && r.tag_name === tag);
            if (draft && draft.target_commitish !== context.sha) {
              throw new Error(`The existing draft for ${tag} targets another commit`);
            }
            if (!draft) {
              draft = (await github.rest.repos.createRelease({
                ...repo, tag_name: tag, target_commitish: context.sha,
                name: `Bazzite Portal ${version}`, body, draft: true, prerelease: false
              })).data;
            }
            const assets = await github.paginate(github.rest.repos.listReleaseAssets,
              { ...repo, release_id: draft.id, per_page: 100 });
            const files = fs.readdirSync('dist').filter(name =>
              name.endsWith('.rpm') || name === 'MD5SUMS' || name === 'CHANGELOG.md');
            for (const name of files) {
              const existing = assets.find(asset => asset.name === name);
              if (existing) await github.rest.repos.deleteReleaseAsset({ ...repo, asset_id: existing.id });
              await github.rest.repos.uploadReleaseAsset({
                ...repo, release_id: draft.id, name, data: fs.readFileSync(`dist/${name}`),
                headers: { 'content-type': name.endsWith('.rpm') ? 'application/x-rpm' : 'text/plain' }
              });
            }
            await github.rest.repos.updateRelease({ ...repo, release_id: draft.id,
              name: `Bazzite Portal ${version}`, body, draft: false, prerelease: false,
              make_latest: 'true' });
            core.info(`Published ${tag} with RPMs, checksums and the complete changelog.`);
